name: 编译 APK

# 重要：这份文件放在子目录里，GitHub 不会把它当成 workflow——它只扫描仓库
# 根目录的 .github/workflows/。真正生效的是仓库根那份 build-wxmsglog.yml，
# 名字叫「编译微信消息存档」，构建时 working-directory 指向 wxmsglog。
#
# 这份文件留在这里是当草稿用：改完记得同步到根目录那份，两边内容应当一致，
# 只差一个路径前缀。

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 多了 NDK 编 llama.cpp 这一步，二十分钟起步，30 分钟不够
    timeout-minutes: 60

    steps:
      - name: 取源码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: 安装 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 准备 Android SDK
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-35" "build-tools;35.0.0" "platform-tools" > /dev/null 2>&1 || true
          echo "平台: $(ls "$ANDROID_HOME/platforms" | tr '\n' ' ')"

      # NDK 有 1G 多，每次都下太浪费。路径写死是因为 actions/cache 的 path
      # 不支持 bash 变量展开，而 runner 镜像里 SDK 位置是固定的。
      - name: 缓存 NDK 与 CMake
        id: toolchain
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk
            /usr/local/lib/android/sdk/cmake
          key: ndk-27.0.12077973-cmake-3.22.1

      - name: 安装 NDK 与 CMake
        if: steps.toolchain.outputs.cache-hit != 'true'
        run: |
          set -eo pipefail
          SDK="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          # yes 在 sdkmanager 读够输入后会收到 SIGPIPE，配合 pipefail 会把整条
          # 管道判成失败。许可这步单独做并显式兜住。
          yes | "$SDK" --licenses > /dev/null 2>&1 || true
          # 安装不再套管道：真出错要让它把错误打出来，而不是被 || true 吞掉
          "$SDK" "ndk;27.0.12077973" "cmake;3.22.1"
          echo "NDK: $(ls "$ANDROID_HOME/ndk")"

      # llama.cpp 源码不进仓库（几百兆）。这里按 tag 拉一份固定版本，
      # llm_jni.cpp 里的 API 就是对着 v0.7.0 的 llama.h 写的。
      - name: 缓存 llama.cpp
        id: llamacpp
        uses: actions/cache@v4
        with:
          path: app/src/main/cpp/llama.cpp
          key: llama-cpp-v0.7.0

      - name: 拉取 llama.cpp
        run: bash tools/clone_llama.sh

      - name: 编译 release
        run: gradle app:assembleRelease --no-daemon --stacktrace

      - name: 取回签名密钥
        uses: actions/cache@v4
        with:
          path: wx.keystore
          key: wxmsglog-keystore-v1

      - name: 签名
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          echo "build-tools: $BT"
          if [ ! -f wx.keystore ]; then
            echo "生成新的签名密钥"
            keytool -genkeypair -v -keystore wx.keystore -storetype PKCS12 \
              -alias wxmsglog -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass wxmsglog -keypass wxmsglog \
              -dname "CN=WxMsgLog, O=Personal, C=CN" > /dev/null 2>&1
          else
            echo "复用缓存密钥"
          fi
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ls -la "$UNSIGNED"
          "${BT}zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "${BT}apksigner" sign --ks wx.keystore --ks-pass pass:wxmsglog \
            --key-pass pass:wxmsglog --out WxMsgLog.apk aligned.apk
          "${BT}apksigner" verify --print-certs WxMsgLog.apk | head -3

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: WxMsgLog
          path: WxMsgLog.apk
          if-no-files-found: error
