              <string name="log_widget_title">NotiFilter 日志</string>
              <string name="log_widget_description">查看记录下来的通知</string>
              <string name="no_notifications_logged">还没有记录任何通知</string>
              <string name="panel_widget_title">NotiFilter 开关</string>
              <string name="panel_widget_description">快速开关规则</string>
              <string name="no_filters_short">还没有规则</string>
              <!-- endregion -->

              <!-- region alttext -->
              <string name="alttext_app_logo">应用图标</string>
              <string name="alttext_back_button">返回按钮</string>
              <string name="alttext_add">添加</string>
              <string name="alttext_subtract">减少</string>
              <string name="alttext_logs">日志</string>
              <string name="alttext_info">信息</string>
              <!-- endregion -->

              <!-- region system -->
              <string name="foreground_notification_content">NotiFilter 正在运行</string>
              <!-- endregion -->

          </resources>
          XMLEOF
          echo "已写入 $(wc -c < "$DEST/strings.xml") 字节"
          echo "string 条目数: $(grep -c '<string ' "$DEST/strings.xml")"
          echo "含中文的条目数: $(grep -c '[一-龥]' "$DEST/strings.xml")"
          # 结构合法性校验，坏了就提前失败，不用等到编译
          python3 -c "import xml.etree.ElementTree as ET; ET.parse('$DEST/strings.xml'); print('XML 合法')"

      - name: 准备 Android SDK
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;35.0.0" "platform-tools" > /dev/null 2>&1 || true
          echo "sdk 平台: $(ls "$ANDROID_HOME/platforms" | tr '\n' ' ')"

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: 编译 release
        working-directory: src
        run: |
          set -euo pipefail
          chmod +x gradlew || true
          ./gradlew app:assembleRelease --no-daemon --stacktrace

      - name: 取回签名密钥
        uses: actions/cache@v4
        with:
          path: zh.keystore
          key: notifilter-zh-keystore-v1

      - name: 签名
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)"
          echo "使用 build-tools: $BT"
          # 首次运行生成密钥，之后靠缓存复用同一份，保证新版能覆盖安装旧版
          if [ ! -f zh.keystore ]; then
            echo "生成新的签名密钥"
            keytool -genkeypair -v -keystore zh.keystore -storetype PKCS12 \
              -alias notifilter -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass notifilter -keypass notifilter \
              -dname "CN=NotiFilter zh-CN, O=Personal, C=CN" > /dev/null 2>&1
          else
            echo "复用缓存的签名密钥"
          fi
          UNSIGNED="src/app/build/outputs/apk/release/app-release-unsigned.apk"
          ls -la "$UNSIGNED"
          "${BT}zipalign" -f -p 4 "$UNSIGNED" aligned.apk
          "${BT}apksigner" sign --ks zh.keystore --ks-pass pass:notifilter \
            --key-pass pass:notifilter --out NotiFilter-zh.apk aligned.apk
          "${BT}apksigner" verify --print-certs NotiFilter-zh.apk | head -5

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: NotiFilter-zh-CN
          path: NotiFilter-zh.apk
          if-no-files-found: error
