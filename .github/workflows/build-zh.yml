              <string name="action_page_title">选择要执行的动作</string>
              <string name="dismiss_long">消除这条通知</string>
              <string name="tap_notification_long">点击这条通知</string>
              <string name="accessibility_service_description">NotiFilter 需要无障碍服务才能替你点击通知。</string>
              <string name="enable_service">启用服务</string>
              <string name="tap_button_long">点击某个按钮</string>
              <string name="button_pattern">按钮匹配式</string>
              <string name="batch_long">合并投递</string>
              <string name="batch_frequency">每 %1$s 小时一次</string>
              <string name="delay_long">延迟通知</string>
              <string name="delay_while_active">规则生效期间一直压着</string>
              <string name="delay_for">延迟固定时长</string>
              <string name="delay_length">延迟 %1$s 分钟</string>
              <string name="debounce_long">连发去抖</string>
              <string name="cooldown_length">冷却 %1$s 分钟</string>
