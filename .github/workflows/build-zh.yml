              <string name="display_options">选择被拦下的通知存在哪里</string>
              <string name="describe_history_screen">应用内的历史页</string>
              <string name="describe_widget">桌面上的日志小组件</string>
              <string name="prompt_log_widget">把小组件添加到桌面</string>
              <string name="make_tappable">让通知可以点击</string>
              <string name="schedule_page_title">设置生效时段</string>
              <string name="run_from">"从 "</string>
              <string name="to">" 到 "</string>
              <string name="on">"，"</string>
              <string name="delay_action_reminder">这段时间内收到的通知会一直压着，直到规则失效才一起放出。</string>
              <string name="empty_active_days">没有选中任何日期</string>
              <string name="invalid_time_range">时间范围不合法</string>
              <string name="filter_cooldown">启用规则级冷却</string>
