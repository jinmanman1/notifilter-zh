              <!-- region AboutScreen -->
              <string name="about">关于</string>
              <string name="app_description">" 会监听设备上的全部通知，并按你的规则安静地处理匹配的那些。"</string>
              <string name="app_links"><![CDATA[基于 <a href="https://github.com/BURG3R5/NotiFilter/blob/master/LICENSE">GPLv3</a> 发布<br/>源码托管在 <a href="https://github.com/BURG3R5/NotiFilter">GitHub</a><br/>更多说明见<a href="https://github.com/BURG3R5/NotiFilter/wiki">项目 wiki</a>]]></string>
              <string name="app_permissions"><![CDATA[权限<small><ul><li>BIND_NOTIFICATION_LISTENER_SERVICE：监听并处理通知</li><li>QUERY_ALL_PACKAGES：新建规则时搜索已安装应用</li><li>BIND_ACCESSIBILITY_SERVICE：执行「点击通知」动作时使用</li><li>POST_NOTIFICATIONS：执行「响铃提醒」动作时使用</li><li>ACCESS_NOTIFICATION_POLICY：执行「免打扰」动作时使用</li><li>REQUEST_IGNORE_BATTERY_OPTIMIZATIONS：执行「清除滞留通知」动作时使用</li><li>FOREGROUND_SERVICE_SPECIAL_USE：可选地把核心服务提升为前台，避免被系统清理</li></ul>其他权限可能由第三方库用于处理后台任务，例如小组件刷新。</small>]]></string>
              <string name="dev_credit"><![CDATA[开发者 <a href="https://github.com/BURG3R5/">BURG3R5</a>]]></string>
              <!-- endregion -->

              <!-- region LicensesScreen -->
              <string name="licenses">开源许可</string>
