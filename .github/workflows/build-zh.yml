              <string name="read_long">朗读通知内容</string>
              <string name="speech_template">朗读模板</string>
              <string name="test_tts">试听朗读</string>
              <string name="test_tts_sentence">这是一段试听文字，用来确认朗读是否正常。</string>
              <string name="tts_not_available">当前语言没有可用的文字转语音资源。</string>
