name: 编译 NotiFilter 中文版

# 建好这个文件、提交后会自动跑一次；以后也可以在 Actions 页面点 "Run workflow" 手动重跑。
on:
  push:
    paths:
      - '.github/workflows/build-zh.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 拉取上游源码 (BURG3R5/NotiFilter, dev 分支)
        uses: actions/checkout@v4
        with:
          repository: BURG3R5/NotiFilter
          ref: dev
          path: src

      - name: 注入简体中文语言包
        run: |
          set -euo pipefail
          DEST=src/app/src/main/res/values-zh-rCN
          mkdir -p "$DEST"
          cat > "$DEST/strings.xml" <<'XMLEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <!-- NotiFilter 简体中文语言包
               上游: BURG3R5/NotiFilter 分支 dev
               放置路径: app/src/main/res/values-zh-rCN/strings.xml
               许可: GPLv3（与上游一致）
               说明: app_name / app_name_launcher 在上游标记为 translatable="false"，此处略去，
                    会自动回退到默认值。带前后空格的条目用双引号包裹，防止 AAPT 裁剪。 -->
          <resources xmlns:tools="http://schemas.android.com/tools" tools:ignore="MissingTranslation">

              <!-- region FiltersScreen -->
              <string name="listener_uninitialized"><![CDATA[正在等系统初始化通知监听服务。<a href="https://github.com/BURG3R5/NotiFilter/wiki/Troubleshooting#stuck-on-waiting-for-os-to-initialize-notification-listener-service">卡住了？</a>]]></string>
              <string name="no_filters">还没有规则。\n点 + 开始。</string>
              <string name="on_weekdays">"工作日 "</string>
              <string name="on_weekends">"周末 "</string>
              <string name="on_days">"%1$s "</string>
              <string name="from_to">%1$s 至 %2$s</string>
              <string name="dismiss_short">消除通知</string>
              <string name="tap_notification_short">点击通知</string>
              <string name="tap_button_short">点击「%1$s」</string>
              <string name="batch_short">每 %1$s 合并一次</string>
              <string name="delay_short">延迟通知</string>
              <string name="delay_by_short">延迟 %1$s</string>
              <string name="debounce_short">连发去抖 %1$s</string>
              <string name="mute_short">静音通知</string>
              <string name="alert_short">响铃提醒</string>
              <string name="disturb_short">关闭免打扰 %1$s</string>
              <string name="dismiss_stale_short">%1$s 后消除</string>
              <string name="replace_short">替换为 %1$s | %2$s</string>
              <string name="read_short">朗读「%1$s」</string>
              <string name="any_app">所有应用</string>
              <string name="history_disabled">历史已关闭</string>
              <string name="filter_disabled">规则已关闭</string>

              <string name="adjust_priorities">调整优先级</string>
              <string name="move_up">上移</string>
              <string name="move_down">下移</string>
              <string name="configure_notifications">配置通知</string>
              <string name="toggle_history">%1$s历史记录</string>
              <string name="disable_history_confirmation">关闭历史记录并清零这条规则的命中次数？被消除的通知将不再保存。</string>
              <string name="enable_history_confirmation">为这条规则开启历史记录？</string>
              <string name="toggle_filter">%1$s规则</string>
              <string name="toggle_filter_confirmation">%1$s这条规则？</string>
              <string name="delete_filter">删除规则</string>
