              <!-- region OnboardingScreen -->
              <string name="onboarding_info_1">NotiFilter 会在后台运行一个低功耗服务，监听设备上的全部通知，并按你的规则安静地处理。\n\n数据不会离开这台设备；NotiFilter 根本没有联网权限。</string>
              <string name="grant_permission">授予权限</string>
              <string name="onboarding_info_2">部分机型上「电池优化」会导致通知消除延迟，你可能还是会先被响一下。\n\n有些厂商的限制更激进，之后可以到设置里打开「常驻前台」。</string>
              <string name="disable_optimization">关闭电池优化</string>
